appId: com.gyros.pos
productName: Gyros POS
electronVersion: 43.8.12
directories:
  output: release
  buildResources: packaging
files:
  - build/**
extraResources:
  - from: ../frontend/dist
    to: web
  - from: ../backend/dist/gyros-backend
    to: backend
win:
  icon: packaging/icon.ico
  target:
    - target: nsis
      arch: [ia32]
  artifactName: GyrosPOS-Setup-${version}-${arch}.exe
nsis:
  installerIcon: packaging/icon.ico
  uninstallerIcon: packaging/icon.ico
  installerHeaderIcon: packaging/icon.ico
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  include: packaging/installer.nsh
  installerLanguages: [en_US, ar_SA]
publish: null
