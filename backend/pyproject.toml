[project]
name = "gyros-pos-backend"
version = "1.0.0"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "openpyxl==3.1.5",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.6"]
package = ["pyinstaller==6.22.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
