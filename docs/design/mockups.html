<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><title>Gyros POS Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=block">
<style>
@page{size:1366px 808px;margin:0}
:root{--ink:#161616;--ink2:#5c5c5c;--line:#d9d9d7;--bg:#f0f0ee;--red:#b50d12;--redbg:#fbeaea;--green:#17683a;--greenbg:#e6f2ea;--amber:#8a5200;--amberbg:#fbf0dc}
*{box-sizing:border-box;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font:15px/1.45 "IBM Plex Sans Arabic",sans-serif;color:var(--ink);background:#fff}
.pg{width:1366px;height:808px;overflow:hidden;break-after:page;position:relative}
.pg:last-child{break-after:auto}
.cap{height:40px;display:flex;align-items:center;gap:14px;padding:0 22px;font-size:13px;direction:ltr;background:#fff;border-bottom:1px solid var(--line);color:var(--ink2)}
.cap b{color:var(--ink)}
.scr{height:768px;position:relative;background:var(--bg);display:flex;flex-direction:column}
bdi.n{font-variant-numeric:tabular-nums;white-space:nowrap}
small{font-size:.78em;color:inherit;opacity:.75}
h1{font-size:24px;font-weight:700}h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:600}
.mut{color:var(--ink2)}.r{color:var(--red)}.g{color:var(--green)}
.row{display:flex;align-items:center;gap:12px}.sb{justify-content:space-between}.grow{flex:1}
.top{height:60px;flex:none;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 20px;gap:16px}
.top img{height:46px}.top nav{display:flex;height:100%;flex:1}
.top nav span{padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:500;color:#cfcfcf;border-bottom:4px solid transparent;border-top:4px solid transparent}
.top nav .on{color:#fff;border-bottom-color:var(--red);font-weight:700}
.cnt{background:#fff;color:var(--ink);border-radius:3px;padding:0 7px;font-size:13px;font-weight:700}
.top .lnk{border:1px solid #666;border-radius:4px;padding:6px 14px;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:5px;background:#fff;border:1px solid #a9a9a7;font-weight:600;white-space:nowrap}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.k{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.s{min-height:36px;padding:0 12px;font-size:14px}.btn.l{min-height:62px;font-size:19px}.btn.d{color:var(--red);border-color:var(--red)}
.box{background:#fff;border:1px solid var(--line);border-radius:6px}
.in{background:#fff;border:1px solid #a9a9a7;border-radius:5px;min-height:46px;padding:0 14px;display:flex;align-items:center;justify-content:space-between}
.in.f{border:2px solid var(--ink)}.lab{font-size:14px;font-weight:600;margin-bottom:5px}
.tag{font-size:13px;font-weight:600;border-radius:3px;padding:2px 9px;background:#e9e9e7;white-space:nowrap}
.tag.g{background:var(--greenbg)}.tag.r{background:var(--redbg)}.tag.a{background:var(--amberbg);color:var(--amber)}
.seg{display:flex;border:1px solid #a9a9a7;border-radius:5px;overflow:hidden;background:#fff}
.seg span{flex:1;text-align:center;padding:10px 16px;font-weight:600;border-inline-start:1px solid #d0d0ce;white-space:nowrap}.seg span:first-child{border:0}.seg .on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}th{font-size:13px;color:var(--ink2);font-weight:600;text-align:start;padding:10px 14px;border-bottom:1px solid #a9a9a7;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #e6e6e4}tr:last-child td{border-bottom:0}
.ord{flex:1;display:flex;min-height:0}.menu{flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;flex:1;align-content:start}
.cat h3{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:700}.cat h3:after{content:"";flex:1;border-top:2px solid var(--red)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1px solid #cfcfcd;border-radius:5px;height:98px;padding:9px 11px;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;line-height:1.3;position:relative}
.tile .pr{font-size:17px;font-weight:700}.tile i{position:absolute;inset-inline-end:8px;bottom:9px;font-style:normal;background:var(--ink);color:#fff;min-width:26px;height:26px;border-radius:3px;text-align:center;line-height:26px;font-size:14px}
.tile.sel{border:2px solid var(--ink);padding:8px 10px}
.tick{width:420px;flex:none;background:#fff;border-inline-start:1px solid var(--line);display:flex;flex-direction:column}
.tick .hd{padding:14px 18px;border-bottom:1px solid var(--line)}
.it{padding:11px 18px;border-bottom:1px solid #e6e6e4;display:flex;gap:12px;align-items:center}
.q{display:flex;align-items:center;border:1px solid #a9a9a7;border-radius:5px;font-weight:700}.q span{width:36px;height:36px;display:grid;place-items:center}.q .v{background:#f0f0ee}
.tot{padding:14px 18px;border-top:2px solid var(--ink);display:grid;gap:7px}.tot .big{font-size:27px;font-weight:700;line-height:1.2}
.note{font-size:13.5px;color:var(--red);font-weight:500}
.adm{flex:1;display:flex;min-height:0}.side{width:216px;background:var(--ink);color:#cfcfcf;padding:16px 0;flex:none;display:flex;flex-direction:column}
.side img{width:150px;margin:0 auto 16px;display:block}.side span{padding:9.5px 22px;font-weight:500;border-inline-start:4px solid transparent}.side .on{color:#fff;font-weight:700;border-color:var(--red);background:#2a2a2a}
.side .bot{margin-top:auto;border-top:1px solid #3a3a3a;padding-top:8px}
.main{flex:1;padding:20px 26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.kp{display:grid;grid-template-columns:1.5fr .8fr 1.1fr 1.5fr;gap:14px}.kp .box{padding:12px 18px}.kp b{font-size:25px;display:block;line-height:1.35;white-space:nowrap}
.bar{height:16px;background:var(--ink);border-radius:0 3px 3px 0}[dir=rtl] .bar{border-radius:3px 0 0 3px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.58);display:grid;place-items:center}.dlg{background:#fff;border-radius:7px;padding:26px 28px;width:500px}
.dark{background:var(--ink);color:#fff;align-items:center;justify-content:center}
.dark .role{width:290px;height:148px;background:#fff;color:var(--ink);border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:25px;font-weight:700}
.dark .role.p{background:var(--red);color:#fff}.dark .role em{font-style:normal;font-size:14px;font-weight:400;opacity:.85}
.form{background:#fff;color:var(--ink);border-radius:7px;padding:26px 28px;width:430px;display:grid;gap:15px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}.pad span{background:#fff;border:1px solid #cfcfcd;border-radius:5px;height:58px;display:grid;place-items:center;font-size:21px;font-weight:600}
.tb{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.tbl{height:172px;border:1px solid #bdbdbb;background:#fff;border-radius:6px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.tbl strong{font-size:31px;line-height:1}.tbl.o{background:var(--ink);color:#fff;border-color:var(--ink)}.tbl.pd{border:3px solid var(--green);padding:12px}
.rcs{flex:1;display:flex;gap:26px;justify-content:center;padding:18px;background:#dededc;align-items:flex-start}
.rc{background:#fff;width:302px;padding:14px 16px;font-size:13px;line-height:1.5}.rc img{display:block;width:150px;margin:0 auto 4px}.rc hr{border:0;border-top:1px dashed #000;margin:7px 0}.rc .row{gap:6px;align-items:baseline}.rc .t{font-size:18px;font-weight:700}.rc .c{text-align:center}.rc .st{border:2px solid #000;text-align:center;font-weight:700;font-size:15px;margin:6px 0}
</style></head><body><script>
let L='ar';const t=(a,e)=>L=='ar'?a:e;
const N=x=>`<bdi class=n dir=ltr>${typeof x=='number'?x.toLocaleString('en-US'):x}</bdi>`;
const M=x=>`<span style="white-space:nowrap">${N(x)} <small>${t('ل.ل','LBP')}</small></span>`;
let P=0,out='';
const page=(title,note,html,lang='ar')=>{P++;out+=`<section class=pg><div class=cap><b>${String(P).padStart(2,'0')}</b><b>${title}</b><span>${note}</span></div><div dir=${lang=='ar'?'rtl':'ltr'} lang=${lang} style="height:768px">${html}</div></section>`};
const scr=(h,c='')=>`<div class="scr ${c}">${h}</div>`;
const top_=on=>`<div class=top><img src=logo.png><nav>${[t('طلب جديد','New order'),t('الطاولات','Tables'),t('الدلفري','Deliveries'),t('بحث عن طلب','Find order')].map((x,i)=>`<span class="${i==on?'on':''}">${x}${i==2?'<b class=cnt>3</b>':''}</span>`).join('')}</nav><span>${t('الكاشير: سارة','Cashier: سارة')}</span><span class=lnk>${t('English','العربية')}</span><span class=lnk>${t('المدير','Admin')}</span><span class=lnk>${t('إنهاء الوردية','End shift')}</span></div>`;
const cash=(on,b)=>scr(top_(on)+b);
const adminNav=()=>[t('المبيعات','Sales'),t('الطلبات','Orders'),t('المنتجات','Products'),t('أكواد الخصم','Promo codes'),t('الورديات','Shifts'),t('الكاشير','Cashiers'),t('المخزون','Inventory'),t('المصاريف','Expenses'),t('الإعدادات','Settings'),t('النسخ الاحتياطي','Backups')];
const adm=(on,b)=>scr(`<div class=adm><div class=side><img src=logo.png>${adminNav().map((x,i)=>`<span class="${i==on?'on':''}">${x}</span>`).join('')}<div class=bot><span style="display:block">${t('أخذ طلب','Take an order')}</span><span style="display:block">${t('English','العربية')}</span><span style="display:block">${t('تسجيل الخروج','Log out')}</span></div></div><div class=main>${b}</div></div>`);
const head=(h,r='')=>`<div class="row sb"><h1>${h}</h1><div class=row>${r}</div></div>`;
const btn=(x,c='')=>`<div class="btn ${c}">${x}</div>`;
const F=(l,v,f='')=>`<div><div class=lab>${l}</div><div class="in ${f}">${v}</div></div>`;
const seg=(a,on)=>`<div class=seg>${a.map((x,i)=>`<span class="${i==on?'on':''}">${x}</span>`).join('')}</div>`;
const tab=(h,rows)=>`<div class=box><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const tag=(x,c='')=>`<span class="tag ${c}">${x}</span>`;
const kv=(k,v,c='')=>`<div class="row sb ${c}"><span>${k}</span><span>${v}</span></div>`;
const menu=[['شاورما اللحمة','Beef shawarma',[['شاورما لحمة وسط',400],['شاورما لحمة كبير',500,2],['شاورما لحمة دوبل',700]]],['شاورما الدجاج','Chicken shawarma',[['شاورما دجاج وسط',300],['شاورما دجاج كبير',350],['شاورما دجاج دوبل',450]]],['الوجبات','Meals',[['فروج مع سرفيس',900],['وجبة شاورما دجاج',450,1],['وجبة شاورما لحمة',700]]],['البطاطا','Fries',[['سندويش بطاطا صغير',200],['سندويش بطاطا كبير',250],['علبة بطاطا صغير',150]]],['المشروبات','Drinks',[['مشروبات غازية',100,2],['لبن',70]]],['سندويش الدجاج','Chicken sandwich',[['سندويش دجاج وسط',300],['سندويش دجاج كبير',450]]],['الإضافات','Extras',[['علبة توم إضافية',50]]]];
const cats=sel=>`<div class=cats>${menu.map(c=>`<div class=cat><h3>${t(c[0],c[1])}</h3><div class=tiles>${c[2].map(p=>`<div class="tile ${sel&&p[2]?'sel':''}"><span>${p[0]}</span><span class=pr>${N(p[1]*1000)}</span>${sel&&p[2]?`<i>${p[2]}</i>`:''}</div>`).join('')}</div></div>`).join('')}</div>`;
const item=(q,n,p,note='',lock)=>`<div class=it>${lock?`<b style="width:36px">${N(q+'×')}</b>`:`<div class=q><span>+</span><span class=v>${q}</span><span>−</span></div>`}<div class=grow><b>${n}</b>${note?`<div class=note>${note}</div>`:(lock?'':`<div class=mut style="font-size:13px">${t('+ ملاحظة','+ Note')}</div>`)}</div><b>${N(p)}</b></div>`;
const I=()=>item(2,'شاورما لحمة كبير',1000000,'بدون بصل')+item(1,'وجبة شاورما دجاج',450000)+item(2,'مشروبات غازية',200000);
const types=on=>seg([t('استلام','Takeaway'),t('صالة','Dine-in'),t('دلفري','Delivery')],on);
const bigTot=(n,u)=>`<div class="row sb"><h2>${t('المجموع','Total')}</h2><div style="text-align:end"><div class=big>${M(n)}</div><div class=mut>${N('$'+u)}</div></div></div>`;
const order=()=>cash(0,`<div class=ord><div class=menu><div class="in" style="min-height:42px;flex:none;color:var(--ink2)">${t('ابحث عن منتج','Search products')}</div>${cats(true)}</div><div class=tick><div class=hd>${types(0)}</div><div class=grow>${I()}</div><div class=tot><div class=row><div class="in grow" style="min-height:42px;color:var(--ink2)">${t('كود الخصم','Promo code')}</div>${btn(t('تطبيق','Apply'),'s')}</div>${bigTot(1650000,'18.44')}<div class=row>${btn(t('إلغاء','Cancel'),'l')}<div class=grow>${btn(t('الدفع','Pay'),'p l')}</div></div></div></div></div>`);
const pop=(bg,d)=>bg.replace(/<\/div>$/,`<div class=ov><div class=dlg>${d}</div></div></div>`);

page('Design foundations','From your printed menu. Work areas stay light so staff can read them all day; black and red are kept for brand and key actions.',scr(`<div style="display:flex;height:100%"><div style="width:470px;background:var(--ink);color:#fff;padding:44px;display:flex;flex-direction:column;justify-content:space-between"><img src=logo.png style="width:380px"><div><h1 style="font-size:34px">Gyros POS</h1><p style="color:#cfcfcf;margin-top:8px">Screen design for approval<br>1366 × 768, Arabic first, English mirrored</p></div></div><div style="flex:1;padding:40px 46px;display:grid;gap:26px;align-content:start;background:#fff"><div><h3 style="margin-bottom:10px">Colour and its one job</h3><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">${[['#161616','Frame, selected'],['#b50d12','Main action, money owed'],['#f0f0ee','Background'],['#ffffff','Cards, products'],['#17683a','Paid, correct'],['#8a5200','Warning']].map(c=>`<div><div style="height:66px;border:1px solid #cfcfcd;border-radius:5px;background:${c[0]}"></div><b style="font-size:13px">${c[0]}</b><div class=mut style="font-size:12.5px;line-height:1.3">${c[1]}</div></div>`).join('')}</div></div><div><h3 style="margin-bottom:8px">Type: IBM Plex Sans Arabic, free to bundle offline</h3><div class=row style="gap:44px;align-items:baseline"><span style="font-size:36px;font-weight:700" dir=rtl>شاورما لحمة كبير</span><span style="font-size:36px;font-weight:700">${N(500000)}</span><span style="font-size:24px;font-weight:600">Large order</span></div></div><div><h3 style="margin-bottom:10px">Controls</h3><div class=row>${btn('Pay','p l')}${btn('Confirm','k')}${btn('Cancel')}${btn('Refund','d')}${tag('Paid','g')}${tag('Unpaid','r')}${tag('Low stock','a')}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:26px"><div><h3>Rules used on every screen</h3><p class=mut>Main service buttons are at least 48 px high. Red fill marks the main action. Status always has words, never colour alone.</p></div><div><h3>Sample data</h3><p class=mut>Products, prices, phone and address are yours. Names, sales and the 89,500 exchange rate are examples.</p></div></div></div></div>`),'en');
const lang=`<div style="position:absolute;top:24px;inset-inline-end:28px" class=row><span style="border:1px solid #666;border-radius:4px;padding:6px 14px">English</span></div>`;
page('Start screen','First screen, and where logout returns',scr(lang+`<img src=logo.png style="width:470px;margin-bottom:52px"><div class=row style="gap:20px"><div class="role p">كاشير<em>الطلبات والدفع</em></div><div class=role>المدير<em>الإدارة والمبيعات</em></div></div>`,'dark'));
page('Login','Cashier shown; Admin uses the same layout plus a recovery-key link',scr(lang+`<img src=logo.png style="width:250px;margin-bottom:28px"><div class=form><h2>دخول الكاشير</h2>${F('اسم المستخدم',N('sara'))}${F('كلمة المرور','••••••••<span class=mut style="font-size:13px">إظهار</span>','f')}${btn('دخول','p l')}${btn('رجوع')}</div>`,'dark'));
page('Open shift','Layout follows the cash-count method Admin selects; "totals" shown',scr(`<img src=logo.png style="width:190px;margin-bottom:24px"><div class=form style="width:520px"><div><h2>فتح الوردية</h2><p class=mut>عدّ النقود الموجودة في الدرج قبل البدء.</p></div>${F('الدولار في الدرج',`${N('20.00')}<b>USD</b>`,'f')}${F('الليرة في الدرج',`${N(1000000)}<b>ل.ل</b>`)}${btn('بدء الوردية','p l')}</div>`,'dark'));
page('Cashier: new order','Products sit in the same order as your printed menu. The whole menu fits without scrolling.',order());
L='en';page('Cashier: new order, English','Everything mirrors. Product names stay as Admin typed them.',order(),'en');L='ar';
page('Payment','Both currencies on one screen. The system calculates; the cashier picks the change mix.',cash(0,`<div class=ord><div class=menu style="padding:22px 28px;gap:18px"><div class="row sb"><h1>الدفع</h1>${btn('رجوع إلى الطلب')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><div class=lab>المبلغ المستلم بالدولار</div><div class="in f" style="min-height:70px;font-size:29px;font-weight:700">${N('10.00')}<small>USD</small></div></div><div><div class=lab>المبلغ المستلم بالليرة</div><div class=in style="min-height:70px;font-size:29px;font-weight:700">${N(1000000)}<small>ل.ل</small></div></div></div><div style="display:grid;grid-template-columns:330px 1fr;gap:24px"><div class=pad>${[1,2,3,4,5,6,7,8,9,'.',0,'<span dir=rtl style="all:unset;font-size:16px">حذف</span>'].map(x=>`<span>${x}</span>`).join('')}</div><div class=box style="padding:18px 20px;display:grid;gap:13px;align-content:start"><div class="row sb"><h2>الباقي للزبون</h2><b style="font-size:23px">${M(245000)}</b></div>${seg(['كله ليرة','أكثره دولار','مختلط'],1)}<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${F('أعطِ دولار',`${N('2.00')}<b>USD</b>`)}${F('أعطِ ليرة',`${N(70000)}<b>ل.ل</b>`)}</div><p class=mut>فرق التدوير: ${M(4000)} لصالح الزبون</p></div></div><div class=mut>سعر الصرف: ${N('1 USD')} = ${M(89500)}</div></div><div class=tick><div class=hd><div class="row sb"><h2>طلب استلام</h2>${tag('غير مدفوع','r')}</div></div><div class=grow>${item(2,'شاورما لحمة كبير',1000000,'بدون بصل',1)+item(1,'وجبة شاورما دجاج',450000,'',1)+item(2,'مشروبات غازية',200000,'',1)}</div><div class=tot>${bigTot(1650000,'18.44')}${kv('المستلم',M(1895000))}${btn('تأكيد الدفع','p l')}</div></div></div>`));
page('Payment saved','Shown only after the payment is stored. Change stays visible until the cashier moves on.',pop(order(),`<div class="row sb"><h1>تم الدفع</h1>${tag('مدفوع','g')}</div><p class=mut>طلب رقم ${N('27')}</p><div class=box style="padding:18px;margin:16px 0;text-align:center"><div class=mut>أعطِ الزبون</div><div style="font-size:30px;font-weight:700">${N('$2.00')} + ${M(70000)}</div></div><div class="tag g" style="padding:10px 14px;margin-bottom:18px">تمت طباعة الفاتورة</div>${btn('طلب جديد','p l')}`));
page('Printer problem','The order is already safe; only the paper failed.',pop(order(),`<div class="row sb"><h1>لم تُطبع الفاتورة</h1>${tag('مدفوع','g')}</div><p style="margin:10px 0 16px">الدفع محفوظ. تأكد من تشغيل الطابعة ووجود الورق ثم أعد المحاولة.</p><div class="row sb box" style="padding:14px 18px;margin-bottom:18px"><span>أعطِ الزبون</span><b>${N('$2.00')} + ${M(70000)}</b></div><div class=row><div class=grow>${btn('إعادة الطباعة','p l')}</div>${btn('متابعة بدون طباعة')}</div>`));
