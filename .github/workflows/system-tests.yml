# Runs the real-app tests (system, end-to-end, compatibility, performance) on both systems.
# Manual, because it needs a screen and is slower than the normal checks. Not yet observed.
name: System tests
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install
        shell: bash
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && npm ci)
          (cd desktop && npm ci)
      - name: Backend tests
        shell: bash
        run: cd backend && uv run pytest -q
      - name: Real-app tests (Linux needs a virtual screen)
        shell: bash
        run: |
          cd desktop
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a npm test
          else
            npm test
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failures-${{ matrix.os }}
          path: desktop/test-results
