name: CI
on: [push]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
